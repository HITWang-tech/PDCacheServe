[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pdcacheserve"
version = "0.1.0"
description = "SLO-aware prefill-decode disaggregated LLM serving control plane"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "Apache-2.0"}
authors = [{name = "HITWang-tech"}]
dependencies = []

[project.optional-dependencies]
api = ["fastapi>=0.110,<1", "uvicorn>=0.29,<1", "httpx>=0.27,<1"]
dev = ["pytest>=8,<9", "ruff>=0.6,<1"]

[project.scripts]
pdserve = "pdserve.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
